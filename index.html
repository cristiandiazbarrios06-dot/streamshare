<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StreamShare</title><style>body{margin:0;background:#090d18;color:#fff;font-family:system-ui;text-align:center}main{max-width:1000px;margin:auto;padding:20px}video{width:100%;max-height:85vh;background:#000;border-radius:16px}button{padding:12px 18px;border:0;border-radius:12px;font-weight:700}.box{background:#111a31;padding:22px;border-radius:18px}#url{width:90%;padding:12px;border-radius:10px;border:1px solid #445;color:#fff;background:#090d18}</style></head><body><main><div class="box"><h1>📺 StreamShare</h1><p id="status">Introduce el enlace de la transmisión.</p><input id="url" placeholder="https://tu-servidor.com/?room=..."/><br><br><button id="go">Ver transmisión</button><video id="video" autoplay playsinline controls></video></div></main><script>
const q=new URLSearchParams(location.search), room=q.get('room'); const status=document.getElementById('status'), video=document.getElementById('video');
let pc;
async function start(r){status.textContent='Conectando…'; const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host); ws.onopen=()=>ws.send(JSON.stringify({type:'join',room:r})); ws.onmessage=async e=>{const m=JSON.parse(e.data); if(m.type==='joined'){pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]}); pc.ontrack=e=>video.srcObject=e.streams[0]; pc.onicecandidate=e=>{if(e.candidate)ws.send(JSON.stringify({type:'ice',room:r,sdpMid:e.candidate.sdpMid,sdpMLineIndex:e.candidate.sdpMLineIndex,candidate:e.candidate.candidate}));};} else if(m.type==='offer'){await pc.setRemoteDescription({type:'offer',sdp:m.sdp}); const a=await pc.createAnswer(); await pc.setLocalDescription(a); ws.send(JSON.stringify({type:'answer',room:r,sdp:a.sdp}));} else if(m.type==='ice'&&pc){try{await pc.addIceCandidate({sdpMid:m.sdpMid,sdpMLineIndex:m.sdpMLineIndex,candidate:m.candidate})}catch{}} else if(m.type==='ended'){status.textContent='La transmisión terminó.'} else if(m.type==='error'){status.textContent=m.message}}; ws.onerror=()=>status.textContent='No se pudo conectar al servidor.'; status.textContent='Esperando al móvil…'}
if(room) start(room); document.getElementById('go').onclick=()=>{const u=new URL(document.getElementById('url').value); if(u.searchParams.get('room')) start(u.searchParams.get('room'));};
</script></body></html>
